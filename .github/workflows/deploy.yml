name: Build and deploy

# This repository is a GitHub *user* site (tyriongump.github.io), so the built
# output is served from the domain root — which is why `base` is '/' in
# vite.config.ts. Nothing here works until Pages is pointed at Actions:
# Settings → Pages → Build and deployment → Source: "GitHub Actions".
#
# Pull requests run every check; only main publishes.

on:
  push:
    branches: [main]
  pull_request:
  # Lets you redeploy the current main without pushing an empty commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Reads the version from the `packageManager` field in package.json, so CI
      # and local development can never drift.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          # Single source of truth with local development.
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Kept as separate steps rather than one `pnpm check`, so a red build
      # names what broke without anyone opening the log.
      - name: Type-check
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Check formatting
        run: pnpm run format:check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm run build

      - name: Install the browser for browser tests
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser tests
        run: pnpm run test:e2e

      - if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6

      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Never let two deploys race. Queue rather than cancel: a cancelled deploy can
    # leave the live site mid-swap.
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
