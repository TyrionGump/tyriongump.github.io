version: 2

updates:
  # The deploy workflow pins actions to major tags (@v4). GitHub retires old
  # majors as their Node runtimes go end-of-life, so without this the breakage
  # surfaces months later, on the day a content change fails to publish. A
  # monthly PR, checked by CI, gets that news at a harmless moment instead.
  #
  # npm is deliberately not watched: everything in package.json is a
  # devDependency, nothing reaches visitors, and Vite/TypeScript/Vitest release
  # often enough that the noise would train you to ignore this bot entirely.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
